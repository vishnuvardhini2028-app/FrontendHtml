<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVBAR</title>
    <style>
        body{
margin:0;
font-family:Arial;
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
background:#2c3e50;
padding:15px;
color:white;
}

.logo{
margin:0;
}

.nav-links{
list-style:none;
display:flex;
gap:20px;
}

.nav-links a{
color:white;
text-decoration:none;
font-size:18px;
}

.nav-links a:hover{
color:yellow
}

/* Responsive */

@media(max-width:768px){

.navbar{
flex-direction:column;
align-items:flex-start;
}

.nav-links{
flex-direction:column;
width:100%;
}

.nav-links li{
padding:10px 0;
}

}
        
    </style>
</head>
<body>
<nav class="navbar">
<h2 class="logo">MySite</h2>

<ul class="nav-links">
<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Products</a></li>
<li><a href="#">Gallery</a></li>
<li><a href="#">Contact</a></li>
</ul>

</nav>
</body>
</html>
